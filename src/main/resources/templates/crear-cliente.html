<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Cliente</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <form th:action="@{/clientes/crear}" th:object="${cliente}" method="post">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Crear Cliente</h1>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>

        <div class="form-group row">
            <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Nombre">
            </div>
        </div>

        <div class="form-group row">
            <label for="apellido1" class="col-sm-2 col-form-label">Apellido 1</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{apellido1}" id="apellido1" class="form-control" placeholder="Primer apellido">
            </div>
        </div>

        <div class="form-group row">
            <label for="apellido2" class="col-sm-2 col-form-label">Apellido 2</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{apellido2}" id="apellido2" class="form-control" placeholder="Segundo apellido (opcional)">
            </div>
        </div>

        <div class="form-group row">
            <label for="ciudad" class="col-sm-2 col-form-label">Ciudad</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{ciudad}" id="ciudad" class="form-control" placeholder="Ciudad">
            </div>
        </div>

        <div class="form-group row">
            <label for="categoria" class="col-sm-2 col-form-label">Categoría</label>
            <div class="col-sm-10">
                <input type="number" min="1" th:field="*{categoria}" id="categoria" class="form-control" placeholder="Categoría (número)">
            </div>
        </div>
    </form>
</div>
</body>
</html>
