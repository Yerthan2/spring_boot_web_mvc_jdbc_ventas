<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Cliente</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <form th:action="@{/comerciales/crear}" th:object="${comercial}" method="post">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Crear Comercialo</h1>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>

        <div class="form-group row">
            <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Nombre">
            </div>
        </div>

        <div class="form-group row">
            <label for="apellido1" class="col-sm-2 col-form-label">Apellido 1</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{apellido1}" id="apellido1" class="form-control" placeholder="Primer apellido">
            </div>
        </div>

        <div class="form-group row">
            <label for="apellido2" class="col-sm-2 col-form-label">Apellido 2</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{apellido2}" id="apellido2" class="form-control" placeholder="Segundo apellido (opcional)">
            </div>
        </div>
        <div class="form-group row mb-3 align-items-center">
            <label for="comision" class="col-sm-2 col-form-label">Comisión</label>
            <div class="col-sm-10 d-flex align-items-center">
                <input type="number" step="0.001" min="0.276" max="0.946" th:field="*{comision}"
                       id="comision" class="form-control me-2" placeholder="Comisión" />
                <div class="text-danger small" th:if="${#fields.hasErrors('comision')}" th:errors="*{comision}"></div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
