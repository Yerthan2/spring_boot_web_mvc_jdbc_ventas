<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Clientes</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1>Clientes</h1>
		<form action="/clientes/crear">
			<button type="submit" class="btn btn-primary">Crear</button>
		</form>
	</div>

	<div class="table-responsive">
		<table class="table table-bordered table-hover align-middle">
			<thead class="table-light">
			<tr>
				<th scope="col" style="width: 5%;">Id</th>
				<th scope="col" style="width: 15%;">Nombre</th>
				<th scope="col" style="width: 15%;">Apellido1</th>
				<th scope="col" style="width: 15%;">Apellido2</th>
				<th scope="col" style="width: 15%;">Ciudad</th>
				<th scope="col" style="width: 15%;">Categoría</th>
				<th scope="col" style="width: 20%;">Acción</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="cliente : ${listaClientes}">
				<td th:text="${cliente.id}">0</td>
				<td th:text="${cliente.nombre}">nombre</td>
				<td th:text="${cliente.apellido1}">apellido1</td>
				<td th:text="${cliente.apellido2 ?: '&nbsp;'}">apellido2</td>
				<td th:text="${cliente.ciudad}">ciudad</td>
				<td th:text="${cliente.categoria}">categoría</td>
				<td>
					<form th:action="@{/clientes/{id}(id=${cliente.id})}" style="display: inline;">
						<button type="submit" class="btn btn-sm btn-outline-primary me-1">Ver Detalle</button>
					</form>
					<form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" style="display: inline;">
						<button type="submit" class="btn btn-sm btn-outline-warning me-1">Editar</button>
					</form>
					<form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="get" style="display: inline;">
						<button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>

<!-- Bootstrap JS Bundle (Popper incluido) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
