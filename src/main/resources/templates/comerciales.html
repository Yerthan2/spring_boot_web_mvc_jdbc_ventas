<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Comerciales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Comerciales</h1>
        <form action="/comerciales/crear">
            <button type="submit" class="btn btn-primary">Crear</button>
        </form>
    </div>

    <hr />

    <div class="row fw-bold border-bottom pb-2 mb-2">
        <div class="col-2 col-md-1">Id</div>
        <div class="col-3 col-md-2">Nombre</div>
        <div class="col-3 col-md-2">Apellido1</div>
        <div class="col-3 col-md-2">Apellido2</div>
        <div class="col-3 col-md-2">Comision</div>
        <div class="col-3 col-md-2">Acciones</div>
    </div>

    <div th:each="comercial : ${listaComercial}" class="row align-items-center mb-2">
        <div class="col-2 col-md-1" th:text="${comercial.id}">0</div>
        <div class="col-3 col-md-2" th:text="${comercial.nombre}">nombre</div>
        <div class="col-3 col-md-2" th:text="${comercial.apellido1}">apellido1</div>
        <div class="col-3 col-md-2" th:text="${comercial.apellido2 ?: '&nbsp;'}">apellido2</div>
        <div class="col-3 col-md-2" th:text="${comercial.comision}">comision</div>
        <div class="col-12 col-md-3">
            <form th:action="@{/comerciales/{id}(id=${comercial.id})}" style="display: inline;">
                <button type="submit" class="btn btn-outline-primary btn-sm me-1">Ver Detalle</button>
            </form>

            <form th:action="@{/comerciales/editar/{id}(id=${comercial.id})}" style="display: inline;">
                <button type="submit" class="btn btn-outline-warning btn-sm me-1">Editar</button>
            </form>

            <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="get" style="display: inline;">
                <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional if you need JS components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
