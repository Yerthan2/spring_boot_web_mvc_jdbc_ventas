<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Detalle Comercial</h1>
        <form action="/comerciales/">
            <button type="submit" class="btn btn-secondary">Volver</button>
        </form>
    </div>

    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Id</label>
        <div class="col-sm-10">
            <input type="text" readonly class="form-control-plaintext" th:value="${comercial.id}" />
        </div>
    </div>

    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Nombre</label>
        <div class="col-sm-10">
            <input type="text" readonly class="form-control-plaintext" th:value="${comercial.nombre}" />
        </div>
    </div>

    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Apellido 1</label>
        <div class="col-sm-10">
            <input type="text" readonly class="form-control-plaintext" th:value="${comercial.apellido1}" />
        </div>
    </div>

    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Apellido 2</label>
        <div class="col-sm-10">
            <input type="text" readonly class="form-control-plaintext" th:value="${comercial.apellido2}" />
        </div>
    </div>
    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Comision</label>
        <div class="col-sm-10">
            <input type="text" readonly class="form-control-plaintext" th:value="${comercial.comision}" />
        </div>
    </div>
    <h2 class="mt-5">Pedidos del Comercial</h2>
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>Fecha</th>
                <th>Total</th>
                <th>Cliente</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pedido : ${list}">
                <td th:text="${pedido.fecha}">2024-06-01</td>
                <td th:text="${pedido.total}">999.99</td>
                <td>
                    <a th:href="@{/clientes/{id}(id=${pedido.id_cliente.id})}"
                       th:text="${pedido.id_cliente.nombre + ' ' + pedido.id_cliente.apellido1}"
                       target="_blank">
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
